<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevStudio - Modern Landing Page</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#eff6ff',
                            100: '#dbeafe',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                        }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 font-sans transition-colors duration-300">

    <!-- NAVBAR -->
    <nav class="fixed top-0 left-0 w-full bg-white/80 dark:bg-slate-900/80 backdrop-blur-md border-b border-slate-200 dark:border-slate-800 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <!-- Logo -->
                <div class="flex items-center space-x-3">
                    <div class="w-10 h-10 bg-brand-600 rounded-xl flex items-center justify-center text-white font-bold text-xl shadow-lg shadow-brand-500/30">
                        <i class="fa-solid fa-code"></i>
                    </div>
                    <span class="text-xl font-bold bg-gradient-to-r from-brand-600 to-indigo-600 bg-clip-text text-transparent">
                        DevStudio
                    </span>
                </div>

                <!-- Desktop Navigation Links -->
                <div class="hidden md:flex items-center space-x-8 text-sm font-medium">
                    <a href="#home" class="hover:text-brand-600 dark:hover:text-brand-500 transition-colors">Beranda</a>
                    <a href="#features" class="hover:text-brand-600 dark:hover:text-brand-500 transition-colors">Fitur</a>
                    <a href="#about" class="hover:text-brand-600 dark:hover:text-brand-500 transition-colors">Tentang</a>
                    <a href="#pricing" class="hover:text-brand-600 dark:hover:text-brand-500 transition-colors">Harga</a>
                </div>

                <!-- Actions (Theme Toggle & CTA) -->
                <div class="hidden md:flex items-center space-x-4">
                    <button id="theme-toggle" class="p-2 rounded-lg bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700 transition-colors">
                        <i id="theme-toggle-dark-icon" class="fa-solid fa-moon hidden"></i>
                        <i id="theme-toggle-light-icon" class="fa-solid fa-sun hidden"></i>
                    </button>
                    <button onclick="openModal()" class="px-4 py-2 bg-brand-600 hover:bg-brand-700 text-white rounded-lg font-medium text-sm transition-all shadow-md hover:shadow-lg shadow-brand-500/20">
                        Hubungi Kami
                    </button>
                </div>

                <!-- Mobile Menu Button -->
                <div class="flex md:hidden items-center space-x-2">
                    <button id="theme-toggle-mobile" class="p-2 rounded-lg bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300">
                        <i id="theme-toggle-dark-icon-mobile" class="fa-solid fa-moon hidden"></i>
                        <i id="theme-toggle-light-icon-mobile" class="fa-solid fa-sun hidden"></i>
                    </button>
                    <button id="mobile-menu-btn" class="p-2 text-slate-600 dark:text-slate-300 focus:outline-none">
                        <i class="fa-solid fa-bars text-xl"></i>
                    </button>
                </div>
            </div>
        </div>

        <!-- Mobile Menu Dropdown -->
        <div id="mobile-menu" class="hidden md:hidden border-b border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 px-4 pt-2 pb-4 space-y-3">
            <a href="#home" class="block py-2 text-sm font-medium hover:text-brand-600">Beranda</a>
            <a href="#features" class="block py-2 text-sm font-medium hover:text-brand-600">Fitur</a>
            <a href="#about" class="block py-2 text-sm font-medium hover:text-brand-600">Tentang</a>
            <a href="#pricing" class="block py-2 text-sm font-medium hover:text-brand-600">Harga</a>
            <button onclick="openModal()" class="w-full mt-2 py-2 bg-brand-600 text-white rounded-lg font-medium text-sm">
                Hubungi Kami
            </button>
        </div>
    </nav>

    <!-- HERO SECTION -->
    <section id="home" class="pt-32 pb-20 md:pt-40 md:pb-28 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="grid md:grid-cols-2 gap-12 items-center">
            <div class="space-y-6">
                <span class="inline-flex items-center gap-2 px-3 py-1 rounded-full text-xs font-semibold bg-brand-50 dark:bg-brand-500/10 text-brand-600 dark:text-brand-400 border border-brand-200 dark:border-brand-500/20">
                    <i class="fa-solid fa-rocket"></i> Versi 2.0 Telah Rilis!
                </span>
                <h1 class="text-4xl sm:text-5xl font-extrabold tracking-tight leading-tight">
                    Bangun Aplikasi Web Masa Depan Lebih Cepat.
                </h1>
                <p class="text-lg text-slate-600 dark:text-slate-400">
                    Solusi platform pengembangan terpadu dengan integrasi modern, keamanan tinggi, dan performa optimal untuk proyek digital Anda.
                </p>
                <div class="flex flex-col sm:flex-row gap-4">
                    <a href="#pricing" class="inline-flex justify-center items-center px-6 py-3 bg-brand-600 hover:bg-brand-700 text-white rounded-xl font-semibold shadow-lg shadow-brand-500/30 transition-all hover:-translate-y-0.5">
                        Mulai Sekarang
                        <i class="fa-solid fa-arrow-right ml-2 text-sm"></i>
                    </a>
                    <a href="#features" class="inline-flex justify-center items-center px-6 py-3 bg-white dark:bg-slate-800 hover:bg-slate-100 dark:hover:bg-slate-700 text-slate-800 dark:text-slate-200 border border-slate-200 dark:border-slate-700 rounded-xl font-semibold transition-all">
                        Pelajari Fitur
                    </a>
                </div>
            </div>
            <!-- Interactive Card / Illustration -->
            <div class="relative">
                <div class="absolute -inset-1 rounded-2xl bg-gradient-to-r from-brand-600 to-indigo-600 opacity-30 blur-xl"></div>
                <div class="relative bg-white dark:bg-slate-800 rounded-2xl p-6 shadow-2xl border border-slate-200/50 dark:border-slate-700/50">
                    <div
